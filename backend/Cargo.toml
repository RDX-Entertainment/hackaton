[package]
name = "legacy-api"
version = "0.1.0"
edition = "2024"
default-run = "legacy-api"

[dependencies]
actix-cors = "0.7"
actix-governor = "0.10"
actix-web = "4"
anyhow = "1"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
cssparser = "0.37"
dotenvy = "0.15"
env_logger = "0.11"
futures-util = "0.3"
jsonwebtoken = "9"
rand = "0.9"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# La caracteristica `log` es lo que hace que un `tracing::warn!` llegue a alguna parte: sin
# ella no hay suscriptor y el evento se descarta en silencio. Con ella sale por `env_logger`,
# que es lo que las dos binarias ya usan.
tracing = { version = "0.1", features = ["log"] }
tracing-actix-web = "0.7"

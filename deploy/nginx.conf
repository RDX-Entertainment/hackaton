server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Detrás de Cloudflare, la IP del cliente llega en esta cabecera; sin esto
    # todos los accesos parecen venir del túnel.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    # **El juego es una sola página.** Sin este `try_files`, recargar estando
    # dentro de una pantalla devuelve 404: esa ruta no es un fichero, la resuelve
    # el router del navegador.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # En desarrollo esto lo hace el proxy de Vite. Aquí lo hace nginx, y por el
    # mismo motivo: que el navegador vea un solo origen y no haya que abrir CORS
    # para que el juego hable con su propia API.
    location /api {
        include /etc/nginx/security-headers.conf;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Algunas acciones del juego resuelven colas largas; el minuto por
        # defecto se queda corto y corta la respuesta a medias.
        proxy_read_timeout 120s;
    }

    # Los ficheros con hash en el nombre no cambian nunca: que el navegador no
    # los vuelva a pedir en cada partida.
    location /assets/ {
        include /etc/nginx/security-headers.conf;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Cabeceras defensivas. Va aparte y se `include` en cada `location` por una trampa de
# nginx: `add_header` no se hereda si el bloque hijo declara el suyo, asi que ponerlas
# una vez a nivel de `server` las perderia justo en `/assets/`, que si tiene el suyo.

# El navegador no adivina el tipo de un fichero: si la API dice JSON, es JSON.
add_header X-Content-Type-Options "nosniff" always;

# Al salir del juego no se cuenta a donde se iba desde dentro.
add_header Referrer-Policy "same-origin" always;

# Nada de esto lo usa el juego, y lo que no se usa no se concede.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# **En modo informe a proposito.** El navegador del juego pinta los sitios de las maquinas
# con `srcDoc`, y esos documentos heredan esta politica: cada sitio trae su `<style>`
# propio, que es exactamente lo que `style-src 'unsafe-inline'` permite y sin lo cual se
# quedarian en blanco. Antes de pasarla a definitiva hay que abrir el internet del juego y
# comprobar la consola: lo que aqui solo se avisa, alli se bloquearia.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

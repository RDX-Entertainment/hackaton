# Cabeceras defensivas. Va aparte y se `include` en cada `location` por una trampa de
# nginx: `add_header` no se hereda si el bloque hijo declara el suyo, asi que ponerlas
# una vez a nivel de `server` las perderia justo en `/assets/`, que si tiene el suyo.

# El navegador no adivina el tipo de un fichero: si la API dice JSON, es JSON.
add_header X-Content-Type-Options "nosniff" always;

# Al salir del juego no se cuenta a donde se iba desde dentro.
add_header Referrer-Policy "same-origin" always;

# Nada de esto lo usa el juego, y lo que no se usa no se concede.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# **En modo informe a proposito.** El navegador del juego pinta los sitios de las maquinas
# con `srcDoc`, y esos documentos heredan esta politica: cada sitio trae su `<style>`
# propio, que es exactamente lo que `style-src 'unsafe-inline'` permite y sin lo cual se
# quedarian en blanco. Antes de pasarla a definitiva hay que abrir el internet del juego y
# comprobar la consola: lo que aqui solo se avisa, alli se bloquearia.
#
# `cloudflareinsights.com` esta permitido porque **Cloudflare inyecta su beacon de analitica
# en la pagina**, y no es opcional desde aqui: entra en el tunel, no en el HTML que sirve
# nginx. Era la unica violacion que quedaba en el informe, y una politica que avisa de algo
# que uno no puede quitar deja de servir para avisar de lo que si. El guion se declara en
# `script-src` y el envio de la medida en `connect-src`, que son las dos cosas que hace.
# El sistema Fosforo tiene dos voces tipograficas y una de ellas, Oxanium, no existe en
# ningun sistema operativo: viene de Google Fonts. Se declara aqui con nombre y apellidos
# --la hoja en `googleapis`, los ficheros en `gstatic`-- en vez de dejar que la politica se
# llene de violaciones que no son ataques. Si algun dia molesta la peticion a terceros, la
# salida es servir la fuente desde `/assets/` y quitar estas dos entradas.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://cloudflareinsights.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
